name: gates

# Fährt genau die Kette, die sonst von Hand läuft. Zwei Eigenheiten dieses
# Repos sind bewusst eingebaut:
#
# 1. Die CI ruft NIEMALS `vault.py checksum` oder `vault.py release`. Beide
#    schreiben und würden genau den Fehler zudecken, den diese Pipeline finden
#    soll: einen Commit, bei dem das Manifest nicht mitgezogen wurde. Am
#    Arbeitsplatz gilt "Tests erst nach checksum", weil man dort mitten in einer
#    Änderung steht. Im Repository ist der committete Stand bereits freigegeben,
#    also gilt die Umkehrung: erst verify, dann Tests, und Drift ist ein Befund.
# 2. Es gibt keine Abhängigkeiten. Kein pip, kein requirements, kein Cache. Die
#    Tests laufen über `unittest discover` statt über pytest, damit die CI
#    dieselbe Nullabhängigkeit hat wie das ausgelieferte Artefakt.

# Beide Branch-Präfixe stehen bewusst nebeneinander: `agent/**` deckt die
# Historie ab, `claude/**` das heutige Namensschema. Das Schema hat sich
# einmal verschoben, ohne dass der Trigger mitzog — Feature-Branches liefen
# danach ungegated, und das fiel nicht auf, weil ein fehlender Lauf kein
# roter Lauf ist. Wer künftig ein Präfix einführt, trägt es hier nach.
on:
  push:
    branches: ["main", "agent/**", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Fängt Verrottung, die ohne Commit entsteht: neues Runner-Image, neue
    # Python-Patchversion, geändertes Verhalten in zipfile oder unicodedata.
    # GitHub schaltet zeitgesteuerte Läufe nach 60 Tagen ohne Repo-Aktivität
    # ab; siehe BETRIEB.md, Abschnitt "Was die CI prüft".
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Die Kette geht nie ins Netz. Aufgeführte Netzquellen werden zwar wie interne
# behandelt, aber ein Gate darf nicht an fremder Verfügbarkeit hängen — sonst
# misst es das Wetter statt den Bestand. Der Schalter greift vor jedem Socket.
env:
  SKILLSAFE_OFFLINE: "1"

jobs:
  gates:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Beobachtet am 06.08.2026: Die Frist läuft ab dem Anlegen des Jobs, nicht
    # ab dem Start auf einem Runner. Lauf 14 bekam nie einen Runner und wurde
    # exakt 15:02 nach dem Anlegen abgeräumt. Ein so beendeter Lauf ist kein
    # roter Lauf, sondern gar keiner — siehe BETRIEB.md, "Ein fehlender Lauf
    # ist kein grüner Lauf".
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Jede Zeile steht hier mit ihrem Ertrag, nicht mit ihrer Absicht.
          # Grundlage sind die ersten 14 Läufe dieses Workflows.
          #
          # 3.9 — zugesagte Untergrenze, System-Python auf macOS. Die belegte
          # API-Untergrenze des Codes liegt darunter, wird aber nicht
          # zugesagt. Wer 3.9 streicht, muss README und BETRIEB.md mitziehen.
          - os: ubuntu-latest
            python: "3.9"
          # 3.13 — aktuelle Fassung, das obere Ende derselben Spanne.
          - os: ubuntu-latest
            python: "3.13"
          # macOS — zweites Dateisystem und die Plattform, auf der der Tresor
          # benutzt wird. Der einzige Job, der je einen Eigenbefund geliefert
          # hat: Lauf 6/7 auf 34b254b, 18 Testfehler, alle drei Ubuntu-Jobs
          # grün. `/var` ist dort ein Symlink auf `/private/var`, und
          # _resolve_external_root verlangte einen kanonischen Pfad. Der
          # Sicherheitsteil des Tresors ist Pfadbehandlung — genau dort laufen
          # Linux und macOS auseinander, und 71 der 97 Tests hängen daran.
          - os: macos-latest
            python: "3.13"
          # Gestrichen am 06.08.2026: ubuntu / 3.11. In 14 Läufen nie ein
          # Eigenbefund. Es saß zwischen 3.9 und 3.13, und was dort bricht,
          # bricht auch an einem der beiden Ränder. Wer es zurückholen will,
          # nennt bitte den Lauf, in dem es allein rot war.

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Laufzeit festhalten
        run: |
          python3 -VV
          python3 -c "import unicodedata; print('unidata', unicodedata.unidata_version)"

      # Reihenfolge ist gemessen, nicht geraten: validate liefert die
      # inhaltliche Begründung, checksum --verify nennt die abweichende Datei
      # beim Namen, doctor fasst zusammen. Erst danach die Tests, sonst liest
      # man einen Manifest-Drift als Testregression.
      - name: validate
        working-directory: wissenstresor
        run: python3 -B scripts/vault.py validate

      - name: checksum --verify
        working-directory: wissenstresor
        run: python3 -B scripts/vault.py checksum --verify

      - name: doctor
        working-directory: wissenstresor
        run: python3 -B scripts/vault.py doctor

      - name: Tests
        run: python3 -B -m unittest discover -s tests -t . -v

      - name: Paketbau (zweites Allowlist-Gate, prüft Reproduzierbarkeit)
        run: python3 -B tools/build_skill_package.py

      - name: Veröffentlichte Zahlen gegen die echte Ausgabe
        run: python3 -B tools/check_docs.py

      # Kleine Regressionsbremsen für Dinge, die niemand von Hand prüft.
      - name: Kein hartes python3-Literal in Tests und Werkzeugen
        run: |
          if grep -rn '"python3"' tests/ tools/; then
            echo "Hartes python3-Literal gefunden; sys.executable verwenden."
            exit 1
          fi

      - name: Keine CRLF-Zeilenenden im Skill-Artefakt
        run: |
          if git grep -Il $'\r' -- wissenstresor/; then
            echo "CRLF im Skill-Ordner; .gitattributes prüfen."
            exit 1
          fi

      - name: Determinismus ist datumsunabhängig
        working-directory: wissenstresor
        run: |
          python3 -B scripts/vault.py query "Was ist OKF?" > /tmp/heute.json
          faketime_hinweis="Kein faketime im Runner; stattdessen zweiter Lauf."
          echo "$faketime_hinweis"
          python3 -B scripts/vault.py query "Was ist OKF?" > /tmp/nochmal.json
          diff /tmp/heute.json /tmp/nochmal.json

      - name: Arbeitsbaum ist nach allen Gates unverändert
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Ein Gate hat geschrieben. Die Kette muss read-only sein."
            exit 1
          fi
